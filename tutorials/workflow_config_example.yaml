# Qlib 工作流配置示例
# 适用于 LightGBM + Alpha158 模型

qlib_init:
    provider_uri: ~/.qlib/qlib_data/cn_data
    region: cn

market: csi300
benchmark: SH000300

data_handler_config: &data_handler_config
    start_time: 2015-01-01
    end_time: 2022-12-31
    fit_start_time: 2015-01-01
    fit_end_time: 2018-12-31
    instruments: csi300

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2019-01-01
        end_time: 2022-12-31
        account: 100000000
        benchmark: SH000300
        exchange_config:
            limit_threshold: 0.095
            deal_price: vwap
        pos_type: Position

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8785
            lambda_l1: 205.699
            lambda_l2: 580.976
            max_depth: 8
            num_leaves: 210
            num_threads: 4

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs:
                    <<: *data_handler_config
            segments:
                train: [2015-01-01, 2018-12-31]
                valid: [2019-01-01, 2019-12-31]
                test: [2020-01-01, 2022-12-31]
